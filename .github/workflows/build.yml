name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17 (Fixes JAVA_HOME=11 Gradle Crash)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache libltdl-dev patch

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<69.0.0" wheel
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK in Clean Directory (Removes 'Autospend-apk.' Path & NDK Conflicts)
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME GRADLE_HOME
          mkdir -p /tmp/clean_build
          cp main.py buildozer.spec /tmp/clean_build/
          cd /tmp/clean_build
          buildozer android debug

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: /tmp/clean_build/bin/*.apk
